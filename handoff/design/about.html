<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="about.title">About — DogMetrics</title>
<link rel="icon" href="assets/dogmetrics-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,300..700&family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/site.css">
<style>
  .story { display: grid; grid-template-columns: 1fr 1.4fr; gap: clamp(40px, 6vw, 96px); }
  @media (max-width: 900px) { .story { grid-template-columns: 1fr; } }
  .story h2 { margin: 0; }
  .story-body p { font-size: 19px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 24px; max-width: 58ch; }
  .team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; margin-top: 56px; }
  @media (max-width: 800px) { .team-grid { grid-template-columns: 1fr; } }
  .t-card { padding: 32px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); display: grid; grid-template-columns: 84px 1fr; gap: 24px; align-items: start; }
  .t-avatar { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, var(--tan), var(--rust-soft)); display: grid; place-items: center; font-family: var(--font-display); font-size: 36px; color: var(--paper); }
  .t-card h3 { font-family: var(--font-display); font-size: 26px; font-weight: 400; margin: 0 0 4px; }
  .t-card .role { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rust); margin-bottom: 12px; }
  .t-card p { font-size: 14px; color: var(--ink-soft); margin: 0; }
  .values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 56px; }
  @media (max-width: 800px) { .values { grid-template-columns: 1fr; } }
  .value { padding: 32px 0 0; border-top: 2px solid var(--rust); }
  .value h3 { font-family: var(--font-display); font-size: 28px; font-weight: 400; margin: 0 0 14px; }
  .value p { color: var(--ink-soft); margin: 0; font-size: 15px; }
  .contact-strip { background: var(--tan-pale); padding: clamp(64px, 8vw, 120px) 0; border-top: 1px solid var(--line); }
  .contact-strip h2 { margin: 0; }
</style>
</head>
<body>

<div data-site-nav data-active="about"></div>

<header class="page-header">
  <div class="container">
    <span class="eyebrow" data-i18n="about.eyebrow"></span>
    <h1 class="h1" data-i18n="about.headline"></h1>
    <p class="lede" data-i18n="about.lede"></p>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="story">
      <div>
        <span class="eyebrow" data-i18n="about.story.eyebrow"></span>
        <h2 class="h2" style="margin-top: 16px;" data-i18n="about.story.title"></h2>
      </div>
      <div class="story-body">
        <p data-i18n="about.story.p1"></p>
        <p data-i18n="about.story.p2"></p>
        <p data-i18n="about.story.p3"></p>
      </div>
    </div>
  </div>
</section>

<section class="section" id="team" style="background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);">
  <div class="container">
    <div style="max-width: 720px;">
      <span class="eyebrow" data-i18n="about.team.eyebrow"></span>
      <h2 class="h2" data-i18n="about.team.title"></h2>
    </div>
    <div class="team-grid">
      <div class="t-card"><div class="t-avatar">A</div><div><h3 data-i18n="about.t1.name"></h3><div class="role" data-i18n="about.t1.role"></div><p data-i18n="about.t1.bio"></p></div></div>
      <div class="t-card"><div class="t-avatar" style="background:linear-gradient(135deg, var(--sage), var(--ink));">M</div><div><h3 data-i18n="about.t2.name"></h3><div class="role" data-i18n="about.t2.role"></div><p data-i18n="about.t2.bio"></p></div></div>
      <div class="t-card"><div class="t-avatar" style="background:linear-gradient(135deg, var(--rust-deep), var(--rust));">S</div><div><h3 data-i18n="about.t3.name"></h3><div class="role" data-i18n="about.t3.role"></div><p data-i18n="about.t3.bio"></p></div></div>
      <div class="t-card"><div class="t-avatar" style="background:linear-gradient(135deg, var(--tan), var(--stone));">J</div><div><h3 data-i18n="about.t4.name"></h3><div class="role" data-i18n="about.t4.role"></div><p data-i18n="about.t4.bio"></p></div></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div style="max-width: 720px;">
      <span class="eyebrow" data-i18n="about.values.eyebrow"></span>
      <h2 class="h2" data-i18n="about.values.title"></h2>
    </div>
    <div class="values">
      <div class="value"><h3 data-i18n="about.v1.title"></h3><p data-i18n="about.v1.body"></p></div>
      <div class="value"><h3 data-i18n="about.v2.title"></h3><p data-i18n="about.v2.body"></p></div>
      <div class="value"><h3 data-i18n="about.v3.title"></h3><p data-i18n="about.v3.body"></p></div>
    </div>
  </div>
</section>

<section class="contact-strip">
  <div class="container" style="display:grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center;">
    <h2 class="h1" data-i18n="about.contact.title"></h2>
    <div>
      <p class="lede" style="margin: 0 0 24px;" data-i18n="about.contact.body"></p>
      <a class="btn btn-primary" href="index.html#contact" data-i18n="nav.demo"></a>
    </div>
  </div>
</section>

<div data-site-footer></div>
<script src="scripts/i18n.js?v=1776539022540"></script>
<script src="scripts/site.js?v=1776539022540"></script>
</body>
</html>
